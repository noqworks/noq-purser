# Example: a restic repository on this server.
BASE="/srv/purser"
SOURCES=("restic:/srv/backup/restic")
WAIT_UNITS=(restic-backup.service)
VERIFY_CMDS=("restic|RESTIC_PASSWORD_FILE=/run/restic/password restic -r {path} check --no-lock")
# Box side (purser.conf): KINDS="restic:restic:7"  (forget/prune only on Sunday)
