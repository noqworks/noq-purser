# Example: a pgBackRest repository. Stanza name and paths are examples.
BASE="/srv/purser"
SOURCES=("pgbackrest:/var/lib/pgbackrest")
WAIT_UNITS=(pgbackrest-diff.service pgbackrest-full.service pgbackrest-expire.service)
# switch WAL right before freezing so the generation ends on a known segment
PRE_FREEZE_CMDS=("runuser -u postgres -- pgbackrest --stanza=main check")
# verify the frozen copy (not the live repository)
VERIFY_CMDS=("pgbackrest|runuser -u postgres -- pgbackrest --stanza=main --repo1-path={path} --process-max=2 --log-level-console=warn verify")
# Box side (purser.conf): KINDS="pgbackrest:pgbackrest:7"  (expire runs after the Sunday full)
# Keep archive-copy=y so a pruned weekly/monthly copy restores with --type=none.
