# Example: a plain directory of dump files (names limited to A-Z a-z 0-9 . _ / + -).
BASE="/srv/purser"
SOURCES=("dir:/var/backups/dumps")
WAIT_UNITS=(dump-nightly.service)
# Box side (purser.conf): KINDS="dir:dumps"
# Without reflink the frozen copy is a full copy (or hard links, if the dump job never
# rewrites a file in place).
