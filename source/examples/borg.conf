# Example: a borg 1.x repository on this server.
BASE="/srv/purser"
SOURCES=("borg:/srv/backup/borg")
WAIT_UNITS=(borg-nightly.service)
# exact freshness needs the passphrase; without it the newest segment time is used
FRESH_CMDS=("borg|BORG_REPO={path} BORG_PASSCOMMAND='cat /run/borg/passphrase' borg list --last 1 --format '{time}' | xargs -I{} date -d {} +%s")
# borg check reads the whole repository: run it outside the box window, not here.
# Box side (purser.conf): KINDS="borg:borg:7"  (compact only on Sunday)
