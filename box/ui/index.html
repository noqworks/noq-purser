<!doctype html>
<html lang="tr">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#eeeeec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1f1f1f" media="(prefers-color-scheme: dark)">
<title>NOQ Purser</title>
<style>
:root{
 --zemin:#eeeeec;--panel:rgba(250,250,248,.8);--kanvas:#e9e9e7;--tasan:linear-gradient(#e9e9e7 50%,#d5d4d0 50%);--sahne:linear-gradient(to top,#d5d4d0 0%,#d5d4d0 1%,#eeeeec 31%,#efeeec 75%,#e9e9e7 100%);
 --yazi:#17181a;--soluk:#62656b;--cok-soluk:#8d9096;
 --cam:rgba(255,255,255,.5);--cam-guclu:rgba(255,255,255,.68);--cam-kenar:rgba(255,255,255,.8);--cam-golge:rgba(30,30,28,.1);
 --parlak:rgba(255,255,255,.95);--cizgi:rgba(20,20,18,.07);--iz:rgba(20,20,18,.04);
 --beyaz:#f6f6f2;--mavi:#3b82f6;--camgobegi:#22c3d6;--yesil:#35c46a;--sari:#f2c744;--turuncu:#f08a2c;--kirmizi:#e5484d;--mor:#9b6cf0;
 --kose:28px;--kose-ic:18px;--ic:22px;--bosluk:14px;--bulanik:28px;
 color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
 --zemin:#0b0b0b;--panel:rgba(28,28,30,.78);--kanvas:linear-gradient(to right,#434343 0%,#000 100%);--tasan:linear-gradient(to right,#434343 0%,#000 100%);--sahne:linear-gradient(to right,#434343 0%,#000 100%);
 --yazi:#f4f4f2;--soluk:#a8a9ab;--cok-soluk:#7c7e82;
 --cam:rgba(255,255,255,.07);--cam-guclu:rgba(255,255,255,.1);--cam-kenar:rgba(255,255,255,.12);--cam-golge:rgba(0,0,0,.45);
 --parlak:rgba(255,255,255,.16);--cizgi:rgba(255,255,255,.08);--iz:rgba(255,255,255,.05);
 color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--kanvas);scrollbar-width:none}
html::-webkit-scrollbar,body::-webkit-scrollbar{display:none}
body{margin:0;min-height:100dvh;color:var(--yazi);font:15px/1.5 ui-sans-serif,system-ui,-apple-system,"SF Pro Text","Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}

/* sahne: Umut'un degradesi (sabit; kaydirmada yeniden boyanmaz) */
/* araç çubuklarının ve lastik kaydırmanın altına da uzanır (iOS Safari) */
.sahne{position:fixed;left:0;right:0;top:-25lvh;height:150lvh;z-index:-1;pointer-events:none;background:var(--sahne) 0 25lvh / 100% 100lvh no-repeat,var(--tasan)}

main{max-width:560px;margin:0 auto;grid-template-columns:minmax(0,1fr);padding:max(18px,env(safe-area-inset-top)) 16px calc(36px + env(safe-area-inset-bottom));display:grid;gap:var(--bosluk)}

/* sıvı cam */
.cam{position:relative;border-radius:var(--kose);padding:var(--ic);background:var(--cam);
 -webkit-backdrop-filter:blur(var(--bulanik)) saturate(170%);backdrop-filter:blur(var(--bulanik)) saturate(170%);
 box-shadow:inset 0 1px 0 var(--parlak),inset 0 0 0 1px var(--cam-kenar),0 18px 40px -18px var(--cam-golge),0 2px 6px var(--cam-golge)}
.cam::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
 background:linear-gradient(160deg,var(--parlak),transparent 38%)}
.cam>*{position:relative}

h1,h2,p{margin:0}
h2{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--cok-soluk)}
.soluk{color:var(--soluk)}

/* başlık */
.ust{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 6px 4px}
.logo{display:block;height:30px;width:auto;color:var(--yazi)}
.hap{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:999px;font-size:13px;color:var(--soluk);white-space:nowrap;
 background:var(--cam-guclu);-webkit-backdrop-filter:blur(20px) saturate(170%);backdrop-filter:blur(20px) saturate(170%);
 box-shadow:inset 0 0 0 1px var(--cam-kenar),inset 0 1px 0 var(--parlak)}
.hap b{width:7px;height:7px;border-radius:50%;background:var(--cok-soluk)}
.hap[data-acik] b{background:var(--mor);box-shadow:0 0 10px var(--mor)}

/* durum kartı */
.kimlik{font-size:13px;font-weight:600;letter-spacing:.08em;color:var(--cok-soluk)}
.cubuk{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:9px;margin:18px 0 20px;padding:16px;border-radius:var(--kose-ic);
 background:#121317;box-shadow:inset 0 2px 8px rgba(0,0,0,.45),inset 0 0 0 1px rgba(255,255,255,.04)}
.cubuk i{aspect-ratio:1;border-radius:50%;background:#26282e;transition:background .5s,box-shadow .5s}
.cubuk i.yanik{background:var(--renk);box-shadow:0 0 6px var(--renk),0 0 22px color-mix(in srgb,var(--renk) 60%,transparent)}
.durum-baslik{font-size:22px;font-weight:650;letter-spacing:-.02em;line-height:1.2}
.durum-metin{margin-top:6px;color:var(--soluk)}

/* ölçüler */
.olcu{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.olcu div{padding:14px 16px;border-radius:var(--kose-ic);background:var(--iz);box-shadow:inset 0 0 0 1px var(--cizgi)}
.olcu dt{font-size:12px;color:var(--cok-soluk)}
.olcu dd{margin:4px 0 0;font-size:20px;font-weight:600;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.olcu dd small{font-size:13px;font-weight:500;color:var(--soluk)}
.genis{grid-column:1/-1}
.genis dd{font-size:15px;font-weight:500}

/* listeler */
.liste{list-style:none;margin:14px 0 0;padding:0;display:grid}
.liste li{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--cizgi)}
.liste li:first-child{border-top:0;padding-top:4px}.liste li:last-child{padding-bottom:0}
.nokta{flex:none;width:12px;height:12px;border-radius:50%;background:var(--renk);box-shadow:0 0 10px color-mix(in srgb,var(--renk) 55%,transparent)}
.nokta.cift{background:linear-gradient(90deg,var(--kirmizi) 50%,var(--beyaz) 50%)}
.liste .sag{margin-left:auto;text-align:right;color:var(--soluk)}
.bos{margin-top:12px;color:var(--soluk)}

/* işlemler */
.islemler{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.islemler button{display:flex;flex-direction:column;align-items:flex-start;gap:14px;padding:16px;border:0;border-radius:var(--kose-ic);text-align:left;
 font:inherit;color:var(--yazi);background:var(--iz);box-shadow:inset 0 0 0 1px var(--cizgi);cursor:pointer;transition:transform .15s,background .2s}
.islemler button:active{transform:scale(.97)}
button:focus{outline:none}button:focus-visible{outline:2px solid var(--yazi);outline-offset:2px}
@media (hover:hover){.islemler button:hover{background:var(--cam-guclu)}}
.islemler svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.not{display:flex;gap:10px;align-items:flex-start;margin-top:14px;padding:14px 16px;border-radius:var(--kose-ic);background:var(--iz);color:var(--soluk);font-size:13px}
.not svg{flex:none;width:16px;height:16px;margin-top:2px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round}

/* alt panel (eşleştirme, işlem kodu): aşağıdan gelen cam sayfa */
.perde{position:fixed;inset:0;z-index:20;display:grid;align-items:end;justify-items:center;padding:12px 10px max(12px,env(safe-area-inset-bottom));
 background:rgba(0,0,0,.28);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .28s}
.perde[data-acik]{opacity:1;pointer-events:auto}
.panel{width:min(100%,540px);max-height:calc(100dvh - 24px);overflow:auto;scrollbar-width:none;transform:translateY(24px);transition:transform .38s cubic-bezier(.2,.8,.2,1);
 background:var(--panel)}
.panel::-webkit-scrollbar{display:none}
.perde[data-acik] .panel{transform:none}
.panel-ust{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:6px}
.panel-ust h3{margin:0;font-size:20px;font-weight:650;letter-spacing:-.02em}
.kapat{flex:none;display:grid;place-items:center;width:36px;height:36px;border:0;border-radius:50%;color:var(--yazi);background:var(--iz);box-shadow:inset 0 0 0 1px var(--cizgi);cursor:pointer}
.kapat svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.panel-metin{margin:0 0 16px;color:var(--soluk)}
.sekme{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:999px;background:var(--iz);box-shadow:inset 0 0 0 1px var(--cizgi);margin-bottom:16px}
.sekme button{border:0;border-radius:999px;padding:9px 10px;font:inherit;font-size:14px;color:var(--soluk);background:none;cursor:pointer;transition:background .25s,color .25s}
.sekme button[aria-pressed=true]{color:var(--yazi);background:var(--cam-guclu);box-shadow:inset 0 0 0 1px var(--cam-kenar),0 4px 12px -6px var(--cam-golge)}
.vizor{position:relative;aspect-ratio:1;max-width:280px;margin:0 auto;border-radius:24px;overflow:hidden;background:#0d0e11;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
.vizor video{width:100%;height:100%;object-fit:cover;display:block}
.vizor .kose{position:absolute;inset:14%;border-radius:18px;
 background:linear-gradient(#fff,#fff) top left/26px 3px,linear-gradient(#fff,#fff) top left/3px 26px,linear-gradient(#fff,#fff) top right/26px 3px,linear-gradient(#fff,#fff) top right/3px 26px,
  linear-gradient(#fff,#fff) bottom left/26px 3px,linear-gradient(#fff,#fff) bottom left/3px 26px,linear-gradient(#fff,#fff) bottom right/26px 3px,linear-gradient(#fff,#fff) bottom right/3px 26px;
 background-repeat:no-repeat;opacity:.9}
.vizor .tarama{position:absolute;left:16%;right:16%;top:16%;height:2px;border-radius:2px;background:var(--camgobegi);box-shadow:0 0 14px var(--camgobegi);animation:tara 2.4s ease-in-out infinite alternate}
@keyframes tara{to{top:84%}}
.vizor .vizor-not{position:absolute;left:12px;right:12px;bottom:12px;margin:0;padding:8px 10px;border-radius:12px;font-size:12px;text-align:center;color:#d8dade;background:rgba(0,0,0,.45);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.alan{width:100%;min-height:110px;resize:none;padding:14px 16px;border:0;border-radius:var(--kose-ic);font:15px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--yazi);
 background:var(--iz);box-shadow:inset 0 0 0 1px var(--cizgi);outline:none}
.alan:focus{box-shadow:inset 0 0 0 1.5px var(--yazi)}
.ana-dugme{width:100%;margin-top:14px;padding:14px;border:0;border-radius:999px;font:inherit;font-weight:600;color:var(--zemin);background:var(--yazi);cursor:pointer}
.ana-dugme:disabled{opacity:.35;cursor:not-allowed}
.adimlar{display:grid;gap:10px;margin:16px 0 0;padding:0;list-style:none;counter-reset:a}
.adimlar li{display:flex;gap:12px;align-items:flex-start;color:var(--soluk);font-size:14px}
.adimlar li::before{counter-increment:a;content:counter(a);flex:none;display:grid;place-items:center;width:22px;height:22px;border-radius:50%;font-size:12px;font-weight:600;color:var(--yazi);background:var(--iz);box-shadow:inset 0 0 0 1px var(--cizgi)}
.adimlar code{font:13px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--yazi);padding:1px 6px;border-radius:6px;background:var(--iz)}
/* işlem kodu: 12 hane, 4-4-4 */
.kod{display:flex;justify-content:center;gap:16px;margin:4px 0 22px}
.kod span{display:flex;gap:8px}
.kod i{width:12px;height:12px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--cok-soluk);transition:background .15s,box-shadow .15s,transform .15s}
.kod i.dolu{background:var(--yazi);box-shadow:none;transform:scale(1.08)}
.tus{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:320px;margin:0 auto}
.tus button{aspect-ratio:1.6;border:0;border-radius:20px;font:inherit;font-size:24px;font-weight:500;color:var(--yazi);background:var(--iz);box-shadow:inset 0 0 0 1px var(--cizgi);cursor:pointer;transition:transform .1s,background .2s}
.tus button:active{transform:scale(.95);background:var(--cam-guclu)}
.tus button.sil svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tus .bos-tus{visibility:hidden}
.geri-bildirim{min-height:20px;margin:14px 0 0;text-align:center;font-size:13px;color:var(--soluk)}
.surum{margin:0;text-align:center;font-size:12px;color:var(--cok-soluk);font-variant-numeric:tabular-nums}

/* nesiller: yana kayan küçük kartlar */
.nesil-serit{display:flex;gap:10px;margin:14px calc(var(--ic) * -1) 0;padding:2px var(--ic) 4px;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x proximity;
 overscroll-behavior-x:contain;touch-action:pan-x;scrollbar-width:none}
.nesil-serit::-webkit-scrollbar{display:none}
.nesil{flex:0 0 42%;scroll-snap-align:start;display:grid;gap:6px;padding:14px;border-radius:var(--kose-ic);background:var(--iz);box-shadow:inset 0 0 0 1px var(--cizgi)}
.nesil b{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}
.nesil span{font-size:13px;color:var(--soluk)}
.nesil:first-child{background:var(--cam-guclu);box-shadow:inset 0 0 0 1px var(--cam-kenar)}
.isik-kart{cursor:pointer}
.isik-kart[data-gosteriliyor] .mini{box-shadow:inset 0 2px 6px rgba(0,0,0,.45),0 0 0 2px var(--yazi)}
.geri-bildirim[data-tur=hata]{color:var(--yazi)}

/* alt imza: NOQ ve müessese */
.imza{display:flex;align-items:center;justify-content:center;gap:18px;padding:22px 0 6px;color:var(--cok-soluk)}
.imza a{display:block;color:inherit;opacity:.75;transition:opacity .2s}
.imza a:hover{opacity:1}
.imza-logo{display:block;height:15px;width:auto}
.imza-cizgi{width:1px;height:16px;background:var(--cizgi)}

/* ışık şeridi: yana kayan kartlar, her kartta o durumun canlı çubuğu */
.baslik-satir{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.noktalar{display:flex;justify-content:center;gap:6px;margin-top:14px}
.noktalar i{width:6px;height:6px;border-radius:999px;background:var(--cok-soluk);opacity:.35;transition:width .3s,opacity .3s}
.noktalar i[aria-current]{width:18px;opacity:.9}
.sayac{font-size:12px;color:var(--cok-soluk);font-variant-numeric:tabular-nums}
.serit{display:flex;gap:12px;margin:14px calc(var(--ic) * -1) 0;padding:2px var(--ic) 4px;overflow-x:auto;overflow-y:hidden;
 scroll-snap-type:x mandatory;scroll-padding-inline:var(--ic);overscroll-behavior-x:contain;touch-action:pan-x;
 scrollbar-width:none}
.serit::-webkit-scrollbar{display:none}
.serit:focus-visible{outline:none}
.isik-kart{flex:0 0 100%;scroll-snap-align:start;scroll-snap-stop:always;display:grid;grid-template-columns:minmax(0,1fr);gap:14px;padding:16px;border-radius:var(--kose-ic);
 background:var(--iz);box-shadow:inset 0 0 0 1px var(--cizgi);transition:transform .35s cubic-bezier(.2,.8,.2,1),opacity .35s}
.isik-kart b{display:block;font-size:19px;font-weight:600;letter-spacing:-.01em}
.isik-kart span{color:var(--soluk);font-size:14px}
.mini{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:9px;padding:15px;border-radius:12px;background:#121317;box-shadow:inset 0 2px 6px rgba(0,0,0,.45)}
.mini i{aspect-ratio:1;border-radius:50%;background:#26282e}
.mini i.yan{background:var(--r);box-shadow:0 0 5px var(--r),0 0 14px color-mix(in srgb,var(--r) 55%,transparent)}
.cubuk i.yan{background:var(--r);box-shadow:0 0 6px var(--r),0 0 22px color-mix(in srgb,var(--r) 60%,transparent)}
.cubuk[data-desen=dolan] i{animation:dolan 2.4s calc(var(--i) * .22s) infinite both}
.cubuk[data-desen=nefes] i{animation:nefes 2.2s ease-in-out infinite}
.cubuk[data-desen=nefes-yavas] i{animation:nefes 3.6s ease-in-out infinite}
.cubuk[data-desen=donusum] i{animation:donusum 1.6s steps(1,end) infinite}
.mini[data-desen=dolan] i{animation:dolan 2.4s calc(var(--i) * .22s) infinite both}
.mini[data-desen=nefes] i{animation:nefes 2.2s ease-in-out infinite}
.mini[data-desen=nefes-yavas] i{animation:nefes 3.6s ease-in-out infinite}
.mini[data-desen=donusum] i{animation:donusum 1.6s steps(1,end) infinite}
@keyframes dolan{0%{background:#26282e;box-shadow:none}12%,70%{background:var(--r);box-shadow:0 0 5px var(--r),0 0 14px color-mix(in srgb,var(--r) 55%,transparent)}100%{background:#26282e;box-shadow:none}}
@keyframes nefes{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes donusum{0%{background:var(--r);box-shadow:0 0 5px var(--r),0 0 14px color-mix(in srgb,var(--r) 55%,transparent)}50%{background:var(--r2);box-shadow:0 0 5px var(--r2),0 0 14px color-mix(in srgb,var(--r2) 55%,transparent)}}
@media (hover:hover){.isik-kart:hover{transform:translateY(-2px)}}

@media (prefers-reduced-motion:reduce){.cubuk i,.isik-kart{transition:none}.mini i{animation:none!important}}
@supports not ((-webkit-backdrop-filter:blur(1px)) or (backdrop-filter:blur(1px))){.cam,.hap{background:var(--cam-guclu)}}
</style>
<div class="sahne" aria-hidden="true"></div>

// her durumun çubuktaki görünüşü (purser-light ile aynı anlam)
const GORUNUS={ready:["beyaz",null,"sabit",[]],unpaired:["beyaz",null,"sabit",[0,7]],pulling:["mavi",null,"dolan",[]],checking:["camgobegi",null,"nefes",[]],
 done:["yesil",null,"sabit",[]],warning:["sari",null,"sabit",[]],fault:["turuncu",null,"sabit",[]],suspect:["kirmizi",null,"nefes-yavas",[]],
 locked:["kirmizi","beyaz","donusum",[]],maint:["mor","yesil","donusum",[]]};
function cubukCiz(el,durum){const [r,r2,desen,yanik]=GORUNUS[durum]||GORUNUS.unpaired;
 el.dataset.desen=desen;el.style.setProperty("--r",`var(--${r})`);if(r2)el.style.setProperty("--r2",`var(--${r2})`);else el.style.removeProperty("--r2");
 if(el.children.length!==8){el.replaceChildren(...Array.from({length:8},(_,i)=>{const n=document.createElement("i");n.style.setProperty("--i",i);return n}))}
 [...el.children].forEach((n,i)=>n.classList.toggle("yan",(desen==="sabit"||desen.startsWith("nefes"))&&(!yanik.length||yanik.includes(i))))}
function sure(sn){const g=Math.floor(sn/86400),s=Math.floor(sn%86400/3600),d=Math.floor(sn%3600/60);return g?`${g} ${METIN.gun} ${s} ${METIN.sa}`:s?`${s} ${METIN.sa} ${d} ${METIN.dk}`:`${d} ${METIN.dk}`}
function derece(v){return v==null?"—":`${v}<small> °C</small>`}
function nesilTarih(id){const t=new Date(`${id.slice(0,10)}T${id.slice(11,13)}:${id.slice(14,16)}:00Z`);
 return t.toLocaleString(DIL==="tr"?"tr-TR":"en-GB",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})}
function boyut(b){return b>=1e12?`${(b/1e12).toFixed(2)} TB`:b>=1e9?`${(b/1e9).toFixed(1)} GB`:`${Math.round(b/1e6)} MB`}
let sonDurum=null;
async function oku(){
 try{const v=await (await fetch("/api/status",{cache:"no-store"})).json();sonDurum=v;
  $("kimlik").textContent=v.id;
  $("bakim").toggleAttribute("data-acik",!!v.maint);$("bakim-metin").textContent=v.maint?METIN.bakimAcik:METIN.bakimKapali;
  const durum=v.code_locked_s>0&&!["suspect","fault"].includes(v.light)?"locked":v.light;
  cubukCiz($("cubuk"),durum);
  const [baslik,metin]=METIN.durumlar[durum]||METIN.durumlar.unpaired;$("durum-baslik").textContent=baslik;$("durum-metin").textContent=metin;
  $("son-gece").textContent=v.last_sound?nesilTarih(v.last_sound):METIN.yedekYok;
  const d=v.disk||{};
  $("disk").textContent=d.model?[d.model,d.size,d.health==null?null:d.health?METIN.saglikli:METIN.sorunlu,v.usage?`${Math.round(v.usage.used*100/v.usage.total)}%`:null].filter(Boolean).join(" · "):METIN.diskYok;
  $("disk-c").innerHTML=derece(d.temp);$("kart-c").innerHTML=derece(v.board_temp);
  $("disk-hiz").innerHTML=d.link?`${parseInt(d.link)}<small> Mbit/s</small>`:"—";
  $("acik").textContent=sure(v.uptime_s);
  const ck=v.clock||{};$("saat").textContent=METIN.saatKaynak[ck.source||"none"];$("saat-dugme").hidden=!(ck.rtc&&ck.source!=="ntp");
  $("surum").textContent=`${METIN.surum} ${v.version}`;
  const ns=v.generations||[];$("nesil-bos").hidden=ns.length>0;$("nesil-serit").hidden=!ns.length;
  $("nesil-serit").replaceChildren(...ns.slice(0,14).map(n=>{const k=document.createElement("div");k.className="nesil";
   const b=document.createElement("b");b.textContent=nesilTarih(n.id);const sp=document.createElement("span");sp.textContent=boyut(n.bytes);k.append(b,sp);return k}));
  document.querySelector("[data-eslesme]").hidden=!!v.paired;
 }catch(e){$("durum-baslik").textContent=METIN.ulasilamiyor;$("durum-metin").textContent=METIN.ulasilamiyorMetin}
}
async function gonder(yol,veri){const r=await fetch(yol,{method:"POST",headers:{"Content-Type":"application/json","X-Purser":"1"},body:JSON.stringify(veri),cache:"no-store"});
 let j={};try{j=await r.json()}catch(e){}return {ok:r.ok,...j}}
// ışık şeridi: [ad, anlam] (tr / en), renk, ikinci renk, desen, yanan LED'ler (boş = hepsi)
const DURUMLAR=[
 [["Beyaz","Hazır, disk kapalı"],["White","Ready, disk closed"],"ready","beyaz",null,"sabit",[]],
 [["Beyaz, uçlarda nokta","Eşleşmemiş ya da disk hazırlanmamış"],["White, a dot at each end","Not paired, or disk not prepared"],"unpaired","beyaz",null,"sabit",[0,7]],
 [["Mavi","Yedek çekiliyor; çubuk dolar"],["Blue","Pulling the backup; the bar fills"],"pulling","mavi",null,"dolan",[]],
 [["Camgöbeği","Çekilen yedek denetleniyor"],["Cyan","Checking what was pulled"],"checking","camgobegi",null,"nefes",[]],
 [["Yeşil","Bu gece tamam"],["Green","Tonight is done"],"done","yesil",null,"sabit",[]],
 [["Sarı","Uyarı: yedek alındı ama bakılmalı"],["Yellow","Warning: backup taken, needs a look"],"warning","sari",null,"sabit",[]],
 [["Turuncu","Arıza: yedek alınamadı"],["Orange","Fault: the backup could not be taken"],"fault","turuncu",null,"sabit",[]],
 [["Kırmızı","Şüphe. Başka hiçbir durumda yanmaz"],["Red","Suspicion. Never lit for anything else"],"suspect","kirmizi",null,"nefes-yavas",[]],
 [["Mor","Bakım erişimi açık; alttaki durumla dönüşümlü"],["Purple","Maintenance access on; alternates with the state beneath"],"maint","mor","yesil","donusum",[]],
 [["Kırmızı-beyaz","İşlem kodu kilitli"],["Red and white","Operation code locked"],"locked","kirmizi","beyaz","donusum",[]],
];
(function seridiKur(){
 const serit=$("isik-serit"),sayac=$("isik-sayac"),noktalar=$("isik-noktalar");
 serit.replaceChildren(...DURUMLAR.map(([tr,en,anahtar,r,r2,desen,yanik])=>{
  const [ad,anlam]=DIL==="tr"?tr:en;
  const kart=document.createElement("article");kart.className="isik-kart";kart.setAttribute("aria-label",`${ad}: ${anlam}`);
  const mini=document.createElement("div");mini.className="mini";mini.dataset.desen=desen;mini.setAttribute("aria-hidden","true");
  mini.style.setProperty("--r",`var(--${r})`);if(r2)mini.style.setProperty("--r2",`var(--${r2})`);
  for(let i=0;i<8;i++){const n=document.createElement("i");n.style.setProperty("--i",i);if(desen==="sabit"||desen.startsWith("nefes")){if(!yanik.length||yanik.includes(i))n.classList.add("yan")}mini.append(n)}
  const b=document.createElement("b");b.textContent=ad;const s=document.createElement("span");s.textContent=anlam;
  kart.append(mini,b,s);kart.tabIndex=0;kart.dataset.durum=anahtar;
  const goster=async()=>{const x=await gonder("/api/light",{state:anahtar});if(x.ok){kart.toggleAttribute("data-gosteriliyor",true);setTimeout(()=>kart.removeAttribute("data-gosteriliyor"),10000)}};
  kart.addEventListener("click",goster);kart.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();goster()}});
  kart.title=METIN.isikGoster;return kart;
 }));
 const kartlar=[...serit.children];
 noktalar.replaceChildren(...kartlar.map(()=>document.createElement("i")));
 const guncelle=()=>{const sol=serit.scrollLeft;let en=0,fark=1e9;kartlar.forEach((k,i)=>{const d=Math.abs(k.offsetLeft-serit.offsetLeft-sol);if(d<fark){fark=d;en=i}});sayac.textContent=`${en+1} / ${kartlar.length}`;[...noktalar.children].forEach((n,i)=>n.toggleAttribute("aria-current",i===en))};
 let bekliyor=false;serit.addEventListener("scroll",()=>{if(!bekliyor){bekliyor=true;requestAnimationFrame(()=>{bekliyor=false;guncelle()})}},{passive:true});
 serit.addEventListener("keydown",e=>{if(e.key==="ArrowRight"||e.key==="ArrowLeft"){e.preventDefault();serit.scrollBy({left:(e.key==="ArrowRight"?1:-1)*kartlar[0].offsetWidth,behavior:"smooth"})}});
 guncelle();
})();
// paneller: açılınca odak içeride, Esc ve arka plan kapatır
let acikPerde=null,oncekiOdak=null;
function perdeAc(id){const p=$(id);oncekiOdak=document.activeElement;acikPerde=p;p.setAttribute("data-acik","");p.setAttribute("aria-hidden","false");
 setTimeout(()=>p.querySelector(".kapat")?.focus(),50)}
function perdeKapat(){if(!acikPerde)return;acikPerde.removeAttribute("data-acik");acikPerde.setAttribute("aria-hidden","true");acikPerde=null;kameraKapat();oncekiOdak?.focus?.()}
document.querySelectorAll(".perde").forEach(p=>p.addEventListener("click",e=>{if(e.target===p||e.target.closest("[data-kapat]"))perdeKapat()}));
document.addEventListener("keydown",e=>{if(e.key==="Escape")perdeKapat()});
// eşleştirme: QR (tarayıcının BarcodeDetector'ı, yoksa kutudaki jsQR) ya da yapıştır
let akis=null,taraDongu=0;
function kameraKapat(){cancelAnimationFrame(taraDongu);taraDongu=0;akis?.getTracks().forEach(t=>t.stop());akis=null}
function jsqrYukle(){return window.jsQR?Promise.resolve():new Promise((ok,hata)=>{const sc=document.createElement("script");sc.src="/jsqr.js";sc.onload=ok;sc.onerror=hata;document.head.append(sc)})}
async function kameraAc(){
 const not=$("kamera-not"),video=$("kamera");
 if(!window.isSecureContext||!navigator.mediaDevices?.getUserMedia){not.textContent=METIN.kameraKapali;return}
 try{akis=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}});video.srcObject=akis;await video.play();not.textContent=METIN.kameraAcik}
 catch(e){not.textContent=METIN.kameraIzin;return}
 let dedektor=null;try{if("BarcodeDetector" in window)dedektor=new BarcodeDetector({formats:["qr_code"]})}catch(e){}
 if(!dedektor){try{await jsqrYukle()}catch(e){not.textContent=METIN.kameraKapali;return}}
 const tuval=$("qr-tuval"),ctx=tuval.getContext("2d",{willReadFrequently:true});let son=0;
 const tara=async z=>{if(!akis)return;taraDongu=requestAnimationFrame(tara);if(z-son<200||video.readyState<2)return;son=z;
  let metin=null;
  if(dedektor){try{const k=await dedektor.detect(video);metin=k[0]?.rawValue||null}catch(e){}}
  else{const w=video.videoWidth,h=video.videoHeight;if(!w)return;const o=Math.min(1,640/w);tuval.width=Math.round(w*o);tuval.height=Math.round(h*o);
   ctx.drawImage(video,0,0,tuval.width,tuval.height);const r=window.jsQR(ctx.getImageData(0,0,tuval.width,tuval.height).data,tuval.width,tuval.height,{inversionAttempts:"attemptBoth"});metin=r?.data||null}
  if(metin&&metin.startsWith("purser-pair:")){kameraKapat();not.textContent=METIN.qrBulundu;eslesmeGonder(metin)}};
 taraDongu=requestAnimationFrame(tara);
}
async function eslesmeGonder(belirtec){const bild=$("eslesme-bildirim");bild.removeAttribute("data-tur");bild.textContent=METIN.eslesiyor;$("eslesme-gonder").disabled=true;
 const x=await gonder("/api/pair",{token:belirtec.trim(),now:Date.now()});
 if(x.ok){bild.textContent=METIN.eslesti;oku();setTimeout(perdeKapat,2500)}
 else{bild.dataset.tur="hata";bild.textContent=METIN.eslesmeHata.replace("%s",(x.detail||x.error||"").split("\n").pop());$("eslesme-gonder").disabled=false}}
function sekmeSec(ad){document.querySelectorAll("[data-sekme]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.sekme===ad)));
 document.querySelectorAll("[data-bolum]").forEach(b=>b.hidden=b.dataset.bolum!==ad);ad==="qr"?kameraAc():kameraKapat()}
document.querySelectorAll("[data-sekme]").forEach(b=>b.addEventListener("click",()=>sekmeSec(b.dataset.sekme)));
document.querySelector("[data-eslesme]").addEventListener("click",()=>{$("eslesme-bildirim").textContent="";perdeAc("perde-eslesme");sekmeSec("qr")});
$("belirtec").addEventListener("input",e=>{$("eslesme-gonder").disabled=!/^purser-pair:[A-Za-z0-9_-]{40,}$/.test(e.target.value.trim())});
$("eslesme-gonder").addEventListener("click",()=>eslesmeGonder($("belirtec").value));
// işlem kodu: rakam tuş takımı (telefonun klavyesi açılmaz, yakınlaştırma olmaz)
let kod="";
const noktalar=[...$("kod").querySelectorAll("i")];
let islemAdi="",gonderiliyor=false;
const ISLEM={calistir:"run",ozSinama:"selftest",saatAyar:"settime",kapat:"shutdown"};
function kodCiz(){noktalar.forEach((n,i)=>n.classList.toggle("dolu",i<kod.length));if(kod.length===12&&!gonderiliyor)kodGonder()}
async function kodGonder(){gonderiliyor=true;const bild=$("kod-bildirim");bild.removeAttribute("data-tur");bild.textContent=METIN.kodOnizleme;
 const x=await gonder("/api/action",{action:ISLEM[islemAdi],code:kod,now:Date.now()});kod="";noktalar.forEach(n=>n.classList.remove("dolu"));gonderiliyor=false;
 if(x.ok){bild.textContent=METIN.islemTamam[ISLEM[islemAdi]];setTimeout(perdeKapat,2200);oku();return}
 bild.dataset.tur="hata";
 bild.textContent=x.code==="wrong"?METIN.kodYanlis:x.code==="typo"?METIN.kodYazim:x.code==="locked"?METIN.kodKilit.replace("%s",Math.ceil((x.locked_s||60)/60)):x.code==="no_code"?METIN.kodYok:METIN.islemHata.replace("%s",(x.detail||x.error||"").split("\n").pop());
 oku()}
const tuslar=["1","2","3","4","5","6","7","8","9","","0","sil"];
$("tus").replaceChildren(...tuslar.map(t=>{const b=document.createElement("button");b.type="button";
 if(t===""){b.className="bos-tus";b.tabIndex=-1;b.setAttribute("aria-hidden","true")}
 else if(t==="sil"){b.className="sil";b.setAttribute("aria-label",DIL==="tr"?"Sil":"Delete");b.innerHTML='<svg viewBox="0 0 24 24"><path d="M9 6h11v12H9l-6-6z"/><path d="M13 10l4 4M17 10l-4 4"/></svg>';b.onclick=()=>{kod=kod.slice(0,-1);kodCiz()}}
 else{b.textContent=t;b.onclick=()=>{if(kod.length<12){kod+=t;kodCiz()}}}
 return b}));
document.addEventListener("keydown",e=>{if(acikPerde?.id!=="perde-kod")return;if(/^[0-9]$/.test(e.key)&&kod.length<12){kod+=e.key;kodCiz()}else if(e.key==="Backspace"){kod=kod.slice(0,-1);kodCiz()}});
document.querySelectorAll("[data-islem]").forEach(b=>b.addEventListener("click",()=>{kod="";islemAdi=b.dataset.islem;noktalar.forEach(n=>n.classList.remove("dolu"));$("kod-bildirim").textContent="";$("kod-baslik").textContent=METIN.islemAd[b.dataset.islem];perdeAc("perde-kod")}));
oku();setInterval(oku,5000);
</script>
